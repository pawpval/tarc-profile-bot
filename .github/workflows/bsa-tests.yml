name: BSA builder regression tests
# Also checks verified UKSF rank/branch/permission and member-list safe-mode regressions.
on:
  pull_request:
    paths:
      - 'bsa/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bsa-tests.yml'
  push:
    branches: [main]
    paths:
      - 'bsa/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bsa-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm test
